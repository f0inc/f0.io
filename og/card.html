<!doctype html>
<!-- Source of og.png (the link preview image). Rebuild with: npm run og -->
<meta charset="utf-8">
<link rel="stylesheet" href="../paint.css">
<style>
  @font-face { font-family: "GT Alpina"; src: url("../fonts/GT-Alpina-Standard-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "GT America"; src: url("../fonts/GT-America-Standard-Regular.woff2") format("woff2"); font-weight: 400; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #ffffff; color: #1a1a18; -webkit-font-smoothing: antialiased; }
  body { box-sizing: border-box; padding: 96px 104px; display: flex; flex-direction: column; justify-content: space-between; font-family: "GT America", Helvetica, Arial, sans-serif; }
  .logo { font-family: "GT Alpina", Georgia, serif; font-size: 220px; font-weight: 500; line-height: .8; margin: 0; }
  .zero { margin-left: -0.04em; background: var(--paint-zero) 0 54.5% / 100% 78% no-repeat; -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0; font-size: 50px; line-height: 1.2; max-width: 900px; letter-spacing: -0.01em; }
  p span { color: #5f5c55; }
</style>
<h1 class="logo"><span>f</span><span class="zero">0</span></h1>
<p>The best voice agent in the world.<br><span>$0.01 a minute, LLM included.</span></p>
