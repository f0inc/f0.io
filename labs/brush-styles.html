<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>f0 Brush Styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: a contact sheet. Twenty square tiles on paper, one control row on top. Single light theme on purpose: the paint is designed for paper. */
  :root { --bg: #faf8f3; --ink: #1a1a18; --muted: #6a665e; --rule: #dcd7cb; --tile: #f5f2ea; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: var(--mono); font-size: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
  h1 { font: 500 13px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; margin: 0; }
  .lede { color: var(--muted); margin: 6px 0 0; line-height: 1.5; max-width: 62ch; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { font: inherit; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); padding: 6px 10px; border-radius: 3px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .tile { margin: 0; background: var(--tile); border: 1px solid transparent; border-radius: 4px; min-width: 0; cursor: pointer; display: flex; flex-direction: column; padding: 0; font: inherit; color: inherit; text-align: left; }
  .tile.big { grid-column: 1 / -1; }
  .tile.big canvas { max-width: 720px; margin: 0 auto; }
  .tile[aria-pressed="true"] { border-color: var(--ink); }
  .tile canvas { display: block; width: 100%; aspect-ratio: 1; }
  /* GT Alpina trial, internal evaluation only */
  @font-face { font-family: 'AlpinaM'; src: url("../fonts/GT-Alpina-Standard-Medium.woff2") format('woff2'); font-weight: 500; font-display: block; }
  h2 { font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  h2.second { margin-top: 36px; }
  .wtile { margin: 0; background: var(--tile); border-radius: 4px; min-width: 0; display: flex; flex-direction: column; }
  .wm { font-family: 'AlpinaM', Georgia, serif; font-weight: 500; font-size: 112px; line-height: 1; padding: 28px 16px 24px; text-align: center; white-space: nowrap; contain: paint; }
  .wm span { -webkit-background-clip: text; background-clip: text; color: var(--ink); background-repeat: no-repeat; }
  .wm span.on { color: transparent; }
  .wm .eff { position: relative; z-index: 1; padding: 0 0.3em; margin: 0 -0.3em; }
  .wm .zero { position: relative; z-index: 0; margin-left: -0.04em; }
  .cap { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px 10px; border-top: 1px solid var(--rule); }
  .cap b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .cap span { color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>f0 brush styles</h1>
      <p class="lede">Twenty styles, shown twice: first as the f0 wordmark (simple f0, −0.04em spacing, one painting across both letters), then as the moving brush. The numbers match. Click a brush tile to see it large.</p>
    </div>
    <div class="seg" id="states" aria-label="State">
      <button data-state="idle" aria-pressed="true">Idle</button>
      <button data-state="listening" aria-pressed="false">Listening</button>
      <button data-state="thinking" aria-pressed="false">Thinking</button>
      <button data-state="speaking" aria-pressed="false">Speaking</button>
    </div>
  </header>
  <h2>The f0 wordmark in each style</h2>
  <div class="grid" id="wgrid"></div>
  <h2 class="second">The moving brush in each style</h2>
  <div class="grid" id="grid"></div>
</div>

<script>
(() => {
  // ---------- helpers ----------
  const hex = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const sn = (u, s) => (Math.sin(u + s) * 0.5 + Math.sin(u * 1.618 + s * 2.3) * 0.3 + Math.sin(u * 2.718 + s * 3.7) * 0.2);
  const H2 = (a, b) => { const v = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return v - Math.floor(v); };
  const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const BG = hex('#f5f2ea'), WHITE = [251, 246, 233], DEEP = [36, 28, 84], INK = [26, 26, 24];
  const P7 = a => a.map(hex);
  const RAINBOW = P7(['#b5446e', '#d9773a', '#dcb043', '#6f9f52', '#1f8a86', '#33509e', '#5a3f93']);
  const BRIGHT = P7(['#e23d5b', '#f58a1f', '#f6c927', '#5cb85c', '#17a2a2', '#2f6fde', '#7a4fd0']);
  const PASTEL = P7(['#e8a0b4', '#f2b98a', '#f0d484', '#b5d6a0', '#8fd0c8', '#9db7e8', '#b9a4dc']);
  const OIL = (() => { const o = P7(['#2a2f6b', '#1d8a8a', '#c9b24a', '#b04a7a', '#3b2a6b']), r = []; for (let i = 0; i < o.length * 3; i++) r.push(mix(o[Math.floor(i / 3)], o[(Math.floor(i / 3) + 1) % o.length], (i % 3) / 3)); return r; })();
  const at = (pal, j) => pal[((j % pal.length) + pal.length) % pal.length];
  const wheel = (pal, u) => { u = ((u % 1) + 1) % 1 * pal.length; const i = Math.floor(u); return mix(at(pal, i), at(pal, i + 1), u - i); };
  const tone = (c, r) => r > 0.5 ? mix(c, WHITE, (r - 0.5) * 0.7) : mix(c, DEEP, (0.5 - r) * 0.45);
  const BAND = 0.19;
  const bandU = s => (s + BAND * 0.2 * sn(s * 2.32 / BAND, 1.3)) / BAND;

  // call fn at evenly spaced stations along the path; m is a stable index, so marks stay put
  function stations(P, n, ds, fn) {
    for (let i = 0; i < n - 1; i++) {
      const A = P[i], B = P[i + 1], seg = B.s - A.s; if (seg <= 0) continue;
      for (let m = Math.ceil(A.s / ds); m * ds < B.s; m++) {
        const q = (m * ds - A.s) / seg;
        let nx = A.nx + (B.nx - A.nx) * q, ny = A.ny + (B.ny - A.ny) * q; const l = Math.hypot(nx, ny) || 1;
        fn(m, A.x + (B.x - A.x) * q, A.y + (B.y - A.y) * q, nx / l, ny / l, A.hw + (B.hw - A.hw) * q, A.age + (B.age - A.age) * q, m * ds);
      }
    }
  }

  // ---------- renderer: stamped brush tip (real-paint look) ----------
  function Stamp(c) {
    const pal = c.pal, NB = c.nb || 1, R0 = 64, TL = c.tipLen || 0.5, CX = 60, CS = 76, VARS = 2, LV = 12, deep = c.deep || DEEP;
    const lay = [];
    for (let k = 0; k < (c.N || 110); k++) {
      const r = j => H2(k * 1.37 + 11, j * 9.1 + 3.3), rad = Math.sqrt(r(1)), th = r(2) * 6.283, y = rad * Math.sin(th);
      const kr = r(3), kind = kr < (c.light ?? 0.16) ? 1 : kr < (c.light ?? 0.16) + (c.dark ?? 0.11) ? 2 : 0;
      lay.push({ x: rad * Math.cos(th) * TL, y, kind, r: (kind ? 0.025 + r(4) * 0.05 : 0.045 + r(4) * 0.085) * (c.dotR || 1), a: 0.55 + r(5) * 0.45,
        hue: (r(6) - 0.5) * 2, tone: (r(7) - 0.5) * 2, thr: Math.max(0.03, 0.14 + 0.78 * r(8) - 0.32 * Math.abs(y) ** 3) });
    }
    const combs = [null];
    for (let i = 1; i <= LV; i++) {
      const d = i / LV, cc = document.createElement('canvas'); cc.width = 8; cc.height = CS * 2; const g = cc.getContext('2d');
      for (const b of lay) { const over = d - b.thr; if (over <= 0) continue;
        const hw = b.r * R0 * (0.22 + 2.8 * over), a = Math.min(1, over * 4), y = CS + b.y * R0, gr = g.createLinearGradient(0, y - hw, 0, y + hw);
        gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.3, `rgba(0,0,0,${a})`); gr.addColorStop(0.7, `rgba(0,0,0,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr; g.fillRect(0, y - hw, 8, hw * 2); }
      if (d > 0.8) { g.globalAlpha = Math.min(1, (d - 0.8) / 0.2) ** 2; g.fillStyle = '#000'; g.fillRect(0, 0, 8, CS * 2); }
      combs.push(cc);
    }
    const cache = new Map();
    function tip(j, v) {
      const cv = document.createElement('canvas'); cv.width = CX * 2; cv.height = CS * 2; const g = cv.getContext('2d');
      const base = at(pal, j), tv = (H2(j, v * 3.3) - 0.5) * 0.3 * (c.tone ?? 1), body = tv > 0 ? mix(base, WHITE, tv) : mix(base, deep, -tv);
      g.translate(CX, CS);
      g.save(); g.scale(TL * 0.92, 0.86); const bg = g.createRadialGradient(0, 0, 0, 0, 0, R0), ba = c.bodyA ?? 0.96;
      bg.addColorStop(0, rgba(body, ba)); bg.addColorStop(0.78, rgba(body, ba * 0.98)); bg.addColorStop(1, rgba(body, 0));
      g.fillStyle = bg; g.beginPath(); g.arc(0, 0, R0, 0, 7); g.fill(); g.restore();
      for (let m = 0; m < (c.blobs ?? 6); m++) {
        const q = n => H2(m * 5.1 + j * 1.9 + n, v * 7.3 + n * 0.61), rad = Math.sqrt(q(1)) * 0.7, th = q(2) * 6.283, rr = (0.26 + q(3) * 0.26) * R0, w = q(4);
        const col = w < 0.4 ? mix(base, at(pal, j + NB), 0.45 + q(5) * 0.4) : w < 0.7 ? mix(base, at(pal, j - NB), 0.45 + q(5) * 0.4) : w < 0.87 ? mix(base, WHITE, 0.3 + q(5) * 0.3) : mix(base, deep, 0.25 + q(5) * 0.25);
        const al = 0.4 + q(6) * 0.3;
        g.save(); g.translate(rad * Math.cos(th) * TL * R0, rad * Math.sin(th) * R0 * 0.85); g.scale(TL, 0.42);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, rr); gr.addColorStop(0, rgba(col, al)); gr.addColorStop(0.55, rgba(col, al * 0.8)); gr.addColorStop(1, rgba(col, 0));
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rr, 0, 7); g.fill(); g.restore();
      }
      for (let k = 0; k < lay.length; k++) {
        const d = lay[k], q = H2(k + v * 31.7, j * 0.77), ts = c.tone ?? 1;
        let col = mix(base, at(pal, j + (d.hue > 0 ? NB : -NB)), Math.abs(d.hue) * 0.42);
        if (d.kind === 1) col = mix(col, WHITE, (0.32 + q * 0.38) * ts); else if (d.kind === 2) col = mix(col, deep, (0.25 + q * 0.3) * ts);
        else { const tn = (d.tone * 0.6 + tv) * ts; col = tn > 0 ? mix(col, WHITE, tn * 0.45) : mix(col, deep, -tn * 0.34); }
        const rr = d.r * R0, a = d.a * (c.dotA ?? 1);
        g.save(); g.translate(d.x * R0 * 0.8, d.y * R0); g.scale(c.elong || 2.6, 1);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, rr); gr.addColorStop(0, rgba(col, a)); gr.addColorStop(0.5, rgba(col, a * 0.85)); gr.addColorStop(1, rgba(col, 0));
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rr, 0, 7); g.fill(); g.restore();
      }
      return cv;
    }
    function sprite(j, v, lvl) {
      const jj = ((j % pal.length) + pal.length) % pal.length, key = (jj * VARS + v) * (LV + 1) + lvl; let sp = cache.get(key);
      if (!sp) {
        if (!lvl) sp = tip(jj, v);
        else { sp = document.createElement('canvas'); sp.width = CX * 2; sp.height = CS * 2; const g = sp.getContext('2d'); g.drawImage(sprite(jj, v, 0), 0, 0); g.globalCompositeOperation = 'destination-out'; g.drawImage(combs[lvl], 0, 0, CX * 2, CS * 2); }
        cache.set(key, sp);
      }
      return sp;
    }
    const band = c.band || BAND, wet = c.wet ?? 0.45, loadDry = c.loadDry ?? 0.2, dry = c.dry ?? 1;
    return (g, P, n, k, cx, cy) => {
      let carry = 0;
      for (let i = 0; i < n - 1; i++) {
        const A = P[i], B = P[i + 1], seg = B.s - A.s; if (seg <= 0) continue;
        const sp = Math.max(1.6 / k, 0.045 * A.hw);
        for (let dd = carry; dd < seg; dd += sp) {
          const q = dd / seg, s = A.s + dd, age = A.age + (B.age - A.age) * q;
          let nx = A.nx + (B.nx - A.nx) * q, ny = A.ny + (B.ny - A.ny) * q; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
          const u = (s + band * 0.2 * sn(s * 2.32 / band, 1.3)) / band, j = Math.floor(u), f = u - j;
          const dB = f > 0.35 ? (f - 0.35) / 0.65 : 0, dA = age > wet ? (age - wet) / (1 - wet) : 0;
          const d = Math.min(1, Math.max(dB * dB * loadDry, dA * (0.5 + 0.5 * dA)) * dry + (c.base || 0) + (dA > 0.92 ? (dA - 0.92) * 12.5 : 0)), lvl = Math.round(d * LV);
          if (lvl >= LV) continue;
          const sc = (A.hw + (B.hw - A.hw) * q) * (1.07 - 0.13 * f + 0.05 * (H2(j, 4.2) - 0.5)) * k / R0;
          const an = (H2(j, 8.8) - 0.5) * 0.22, ca = Math.cos(an), sa = Math.sin(an), tx = ny, ty = -nx;
          g.setTransform((tx * ca + nx * sa) * sc, (ty * ca + ny * sa) * sc, (nx * ca - tx * sa) * sc, (ny * ca - ty * sa) * sc, cx + (A.x + (B.x - A.x) * q) * k, cy + (A.y + (B.y - A.y) * q) * k);
          g.drawImage(sprite(j, Math.floor(H2(j, 1.7) * VARS), lvl), -CX, -CS);
        }
        carry = Math.max(0, carry + Math.ceil((seg - carry) / sp) * sp - seg);
      }
    };
  }

  // ---------- renderers: vector styles ----------
  const unit = (g, k, cx, cy) => { g.setTransform(k, 0, 0, k, cx, cy); g.lineCap = 'round'; g.lineJoin = 'round'; };
  const Ribbon = c => (g, P, n, k, cx, cy) => {
    unit(g, k, cx, cy);
    for (let i = 1; i < n; i++) { const a = P[i - 1], b = P[i], tp = Math.pow(1 - b.age, c.taper); if (tp < 0.01) continue;
      g.strokeStyle = rgb(mix(c.col(b.s), BG, Math.pow(b.age, 1.6) * (c.fade ?? 0.7))); g.lineWidth = 2 * b.hw * tp * (c.w || 1);
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
    if (c.dot) { const h = P[n - 1]; g.fillStyle = rgb(c.col(h.s)); g.beginPath(); g.arc(h.x, h.y, h.hw * c.dot, 0, 7); g.fill(); }
  };
  const Nib = c => (g, P, n, k, cx, cy) => {
    unit(g, k, cx, cy); const ux = Math.cos(c.ang), uy = Math.sin(c.ang);
    for (let i = 1; i < n; i++) { const a = P[i - 1], b = P[i], wa = a.hw * (1 - a.age * a.age), wb = b.hw * (1 - b.age * b.age);
      const col = rgb(mix(c.col(b.s), BG, Math.pow(b.age, 2) * 0.5)); g.fillStyle = col; g.strokeStyle = col; g.lineWidth = 0.6 / k;
      g.beginPath(); g.moveTo(a.x + ux * wa, a.y + uy * wa); g.lineTo(b.x + ux * wb, b.y + uy * wb); g.lineTo(b.x - ux * wb, b.y - uy * wb); g.lineTo(a.x - ux * wa, a.y - uy * wa); g.closePath(); g.fill(); g.stroke(); }
  };
  const Dots = c => (g, P, n, k, cx, cy) => {
    unit(g, k, cx, cy);
    stations(P, n, c.ds, (m, x, y, nx, ny, hw, age, s) => { for (let q = 0; q < c.K; q++) {
      if (H2(m, q + 7.7) < Math.pow(age, c.diss)) continue;
      const off = (H2(m, q * 3.1 + 1) * 2 - 1), al = (H2(m + 0.5, q * 1.7 + 2) - 0.5) * c.ds * 1.6; if (off * off > H2(m, q + 9) * 0.6 + 0.55) continue;
      const j = Math.floor(bandU(s) + (H2(m, q + 11) - 0.5) * c.jit);
      g.fillStyle = rgb(tone(at(c.pal, j), 0.3 + H2(m, q + 5) * 0.5)); g.beginPath();
      g.arc(x + nx * off * hw + ny * al, y + ny * off * hw - nx * al, hw * c.r * (0.6 + 0.8 * H2(m, q + 3)) * (1 - 0.4 * age), 0, 7); g.fill(); } });
  };
  const Halftone = c => { let cov = null, bnd = null; return (g, P, n, k, cx, cy, view) => {
    const cell = c.cell, G = Math.ceil(2 * view / cell) + 2, org = -G * cell / 2;
    if (!cov || cov.length !== G * G) { cov = new Float32Array(G * G); bnd = new Int16Array(G * G); } else cov.fill(0);
    stations(P, n, 0.02, (m, x, y, nx, ny, hw, age, s) => { const j = Math.floor(bandU(s)), r = Math.ceil(hw / cell) + 1, ix0 = Math.floor((x - org) / cell), iy0 = Math.floor((y - org) / cell);
      for (let iy = iy0 - r; iy <= iy0 + r; iy++) for (let ix = ix0 - r; ix <= ix0 + r; ix++) { if (ix < 0 || iy < 0 || ix >= G || iy >= G) continue;
        const d = Math.hypot(org + (ix + 0.5) * cell - x, org + (iy + 0.5) * cell - y) / hw; if (d >= 1) continue;
        const v = Math.pow(1 - d, 0.6) * (1 - age * age), id = iy * G + ix; if (v > cov[id]) { cov[id] = v; bnd[id] = j; } } });
    unit(g, k, cx, cy);
    for (let id = 0; id < G * G; id++) { const v = cov[id]; if (v < 0.04) continue; g.fillStyle = rgb(at(c.pal, bnd[id])); g.beginPath();
      g.arc(org + (id % G + 0.5) * cell, org + (Math.floor(id / G) + 0.5) * cell, cell * 0.56 * Math.sqrt(v), 0, 7); g.fill(); }
  }; };
  const Dashes = c => (g, P, n, k, cx, cy) => {
    unit(g, k, cx, cy); if (c.cap) g.lineCap = c.cap;
    stations(P, n, c.ds, (m, x, y, nx, ny, hw, age, s) => { for (let q = 0; q < c.K; q++) {
      if (H2(m, q + 7.7) < Math.pow(age, c.diss)) continue;
      const off = (H2(m, q * 3.1 + 1) * 2 - 1) * (c.spread ?? 0.9), ang = (c.fixed !== undefined ? (q % 2 ? c.fixed : -c.fixed) : Math.atan2(-nx, ny)) + (H2(m, q + 2.2) - 0.5) * c.jitA;
      const len = hw * c.len * (0.7 + 0.6 * H2(m, q + 4)) / 2, px = x + nx * off * hw, py = y + ny * off * hw;
      g.strokeStyle = c.mono ? rgba(c.mono, c.alpha * (1 - age * 0.6)) : rgb(tone(at(c.pal, Math.floor(bandU(s) + (H2(m, q + 11) - 0.5) * c.jit)), 0.25 + H2(m, q + 5) * 0.55));
      g.lineWidth = hw * c.w * (0.7 + 0.6 * H2(m, q + 6)); g.beginPath(); g.moveTo(px - Math.cos(ang) * len, py - Math.sin(ang) * len); g.lineTo(px + Math.cos(ang) * len, py + Math.sin(ang) * len); g.stroke(); } });
  };
  const Water = c => { const sprites = c.pal.map(col => { const cv = document.createElement('canvas'); cv.width = cv.height = 64; const g = cv.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, rgba(col, 0.45)); gr.addColorStop(0.7, rgba(col, 0.6)); gr.addColorStop(0.9, rgba(col, 1)); gr.addColorStop(1, rgba(col, 0)); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return cv; });
    return (g, P, n, k, cx, cy) => { g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'multiply';
      stations(P, n, 0.012, (m, x, y, nx, ny, hw, age, s) => { const r = hw * (1.05 + 0.25 * H2(m, 2)) * k, j = Math.floor(bandU(s) + (H2(m, 5) - 0.5) * 1.2), o = (H2(m, 3) - 0.5) * hw * 0.5 * k;
        g.globalAlpha = c.a * Math.pow(1 - age, 1.3); g.drawImage(at(sprites, j), cx + x * k + nx * o - r, cy + y * k + ny * o - r, r * 2, r * 2); });
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }; };
  const Marker = c => (g, P, n, k, cx, cy) => {

  // ---------- the twenty ----------

  const STYLES = [
    ['Impasto', 'thick oil, short dabs', Stamp({ pal: RAINBOW })],
    ['Wet oil', 'loaded, glossy, no gaps', Stamp({ pal: BRIGHT, dry: 0.35, loadDry: 0, wet: 0.7, N: 70, dotR: 1.4, tone: 0.8, band: 0.24 })],
    ['Dry brush', 'scratchy, running out of paint', Stamp({ pal: RAINBOW, base: 0.3, dry: 1.3, wet: 0.2, bodyA: 0.55, N: 140 })],
    ['Sumi ink', 'one black stroke, ensō', Stamp({ pal: [INK], deep: [0, 0, 0], base: 0.12, dry: 1.4, wet: 0.25, loadDry: 0.6, tone: 1.3, band: 0.5 })],
    ['Oil slick', 'one colour at a time, slow drift', Stamp({ pal: OIL, band: 0.1, loadDry: 0, tone: 0.7, blobs: 3 })],
    ['Gouache', 'matte pastel dabs', Stamp({ pal: PASTEL, tone: 0.5, light: 0.08, dark: 0.05, dry: 0.7, N: 60, dotR: 1.3 })],
    ['Clean line', 'smooth gradient, tapered', Ribbon({ taper: 1, col: rainbowS(RAINBOW), dot: 1 })],
    ['Ink comet', 'black dot with a tail', Ribbon({ taper: 1.6, col: () => INK, fade: 0, w: 0.7, dot: 1 })],
    ['Nib', 'calligraphy pen, thick and thin', Nib({ ang: -0.7, col: () => INK })],
    ['Pointillist', 'Seurat dots', Dots({ pal: BRIGHT, ds: 0.012, K: 5, r: 0.13, jit: 2.2, diss: 1.6 })],

    ['Van Gogh', 'short thick dashes', Dashes({ pal: RAINBOW, ds: 0.02, K: 3, len: 0.95, w: 0.2, jitA: 0.7, jit: 1.6, diss: 1.5 })],
    ['Pencil', 'graphite cross-hatching', Dashes({ mono: [60, 60, 58], alpha: 0.6, ds: 0.008, K: 2, len: 1.1, w: 0.03, fixed: 0.8, jitA: 0.25, jit: 0, diss: 1.2, spread: 0.95 })],

  // ---------- the wordmark, painted in each style ----------

      const pad = parseFloat(getComputedStyle(e).paddingLeft), L = Math.min(re.left + pad, rz.left), T = Math.min(re.top, rz.top) + re.height * 0.12, R = Math.max(re.right - pad, rz.right), B = Math.max(re.bottom, rz.bottom) - re.height * 0.1;

  // ---------- motion (same for every tile) ----------

  LOOK.idle.trail = 0.97 * 2 * Math.PI / (3 * opts.speed); LOOK.listening.trail = 0.95 * 2 * Math.PI / (1.4 * opts.speed);

    const n0 = pts.length; if (n0 < 3) return;
    const lp = pts[n0 - 1], hd = Math.hypot(x - lp.x, y - lp.y), P = hd > 1e-4 ? pts.concat([{ x, y, nx: lp.nx, ny: lp.ny, w: dotR(), t, s: lp.s + hd }]) : pts, n = P.length;
