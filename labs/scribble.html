<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>f0 Scribble Orb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<style>
  /* Layout: one large square stage on paper, a short control column beside it; stacks on phones. Single light theme on purpose: the paint is made for paper. */
  :root { --bg: #faf8f3; --ink: #1a1a18; --muted: #6a665e; --rule: #dcd7cb; --chip: #efebe1; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; --serif: "Newsreader", Georgia, serif; }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: var(--mono); font-size: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
  .wrap { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 32px; align-items: start; }
  @media (max-width: 800px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
  .stage { position: relative; }
  #c { display: block; width: 100%; aspect-ratio: 1; max-width: 100%; }
  .tag { position: absolute; left: 0; top: 0; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
  .sizes { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 24px; padding-top: 16px; border-top: 1px solid var(--rule); }
  .sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); font-size: 10px; }
  .sizes canvas { display: block; }
  aside { display: flex; flex-direction: column; gap: 20px; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 0; }
  .lede { color: var(--muted); line-height: 1.5; margin: 6px 0 0; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  legend { padding: 0; margin-bottom: 8px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { font: inherit; border: 1px solid var(--rule); background: var(--chip); color: var(--ink); padding: 6px 10px; border-radius: 3px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 40px; gap: 10px; align-items: center; }
  .row output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--ink); }
</style>

<div class="wrap">
  <div>
    <div class="stage"><canvas id="c" aria-label="The f0 orb: a hand scribbling short strokes of paint in one spot"></canvas><div class="tag" id="tag">idle</div></div>
    <div class="sizes">
      <figure><canvas id="s20" width="20" height="20"></canvas>20</figure>
      <figure><canvas id="s32" width="32" height="32"></canvas>32</figure>
      <figure><canvas id="s64" width="64" height="64"></canvas>64</figure>
      <figure><canvas id="s128" width="128" height="128"></canvas>128</figure>
    </div>
  </div>
  <aside>
    <div>
      <h1>Scribble</h1>
      <p class="lede">A hand holding a brush, scribbling in one spot. The strokes sit side by side with paper showing between them, layer over layer at different angles, so the colours mix in the eye. The colour drifts steadily through the rainbow.</p>
    </div>
    <fieldset><legend>State</legend>
      <div class="seg" id="states">
        <button data-state="idle" aria-pressed="true">Idle</button>
        <button data-state="listening" aria-pressed="false">Listening</button>
        <button data-state="thinking" aria-pressed="false">Thinking</button>
        <button data-state="speaking" aria-pressed="false">Speaking</button>
      </div>
    </fieldset>
    <fieldset id="sliders"><legend>Adjust</legend></fieldset>
  </aside>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const hex = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };

  const sn = (u, s) => (Math.sin(u + s) * 0.5 + Math.sin(u * 1.618 + s * 2.3) * 0.3 + Math.sin(u * 2.718 + s * 3.7) * 0.2);

  const BGC = '#faf8f3', WHITE = [251, 246, 233], DEEP = [36, 28, 84], BAND = 0.19;
  const at = (pal, j) => pal[((j % pal.length) + pal.length) % pal.length];
  const P7 = ['#b5446e', '#d9773a', '#dcb043', '#6f9f52', '#1f8a86', '#33509e', '#5a3f93'].map(hex), PAL = [];
  for (let i = 0; i < 21; i++) PAL.push(mix(P7[Math.floor(i / 3)], P7[(Math.floor(i / 3) + 1) % 7], (i % 3) / 3));

  // ---------- renderer: stamped brush tip (real-paint look) ----------
  function Stamp(c) {

        hue: (r(6) - 0.5) * 2, tone: (r(7) - 0.5) * 2, thr: Math.max(0.03, 0.14 + 0.78 * r(8) - 0.32 * Math.abs(y) ** 3) });
    }
    const combs = [null];
    for (let i = 1; i <= LV; i++) {
      const d = i / LV, cc = document.createElement('canvas'); cc.width = 8; cc.height = CS * 2; const g = cc.getContext('2d');

        const hw = b.r * R0 * (0.22 + 2.8 * over), a = Math.min(1, over * 4), y = CS + b.y * R0, gr = g.createLinearGradient(0, y - hw, 0, y + hw);

    }
    const cache = new Map();
    function tip(j, v) {
      const cv = document.createElement('canvas'); cv.width = CX * 2; cv.height = CS * 2; const g = cv.getContext('2d');
      const base = at(pal, j), tv = (H2(j, v * 3.3) - 0.5) * 0.3 * (c.tone ?? 1), body = tv > 0 ? mix(base, WHITE, tv) : mix(base, deep, -tv);
      g.translate(CX, CS);
      g.save(); g.scale(TL * 0.92, 0.86); const bg = g.createRadialGradient(0, 0, 0, 0, 0, R0), ba = c.bodyA ?? 0.96;
      bg.addColorStop(0, rgba(body, ba)); bg.addColorStop(0.78, rgba(body, ba * 0.98)); bg.addColorStop(1, rgba(body, 0));

        const col = w < 0.4 ? mix(base, at(pal, j + NB), 0.45 + q(5) * 0.4) : w < 0.7 ? mix(base, at(pal, j - NB), 0.45 + q(5) * 0.4) : w < 0.87 ? mix(base, WHITE, 0.3 + q(5) * 0.3) : mix(base, deep, 0.25 + q(5) * 0.25);

        else { sp = document.createElement('canvas'); sp.width = CX * 2; sp.height = CS * 2; const g = sp.getContext('2d'); g.drawImage(sprite(jj, v, 0), 0, 0); g.globalCompositeOperation = 'destination-out'; g.drawImage(combs[lvl], 0, 0, CX * 2, CS * 2); }

  const brush = Stamp({ pal: PAL, nb: 3, tone: 0.5, wet: 0.5, loadDry: 0.12, dry: 1 });

  // ---------- controls ----------
  const opts = { len: 0.2, speed: 1, size: 0.022, spread: 1, hue: 10, gap: 0.6 };
  const SL = [['len', 'Stroke length', 0.03, 0.5, 0.01], ['size', 'Brush size', 0.015, 0.1, 0.005], ['speed', 'Hand speed', 0.3, 3, 0.05], ['spread', 'Spread', 0.4, 2, 0.05], ['hue', 'Colour change', 0, 40, 1], ['gap', 'Gaps', 0, 2, 0.05]];
  const box = document.getElementById('sliders');
  for (const [k, label, min, max, step] of SL) { const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label for="r-${k}">${label}</label><input id="r-${k}" type="range" min="${min}" max="${max}" step="${step}" value="${opts[k]}"><output id="o-${k}">${opts[k]}</output>`;
    box.appendChild(row); const inp = row.querySelector('input'), out = row.querySelector('output'); inp.addEventListener('input', () => { opts[k] = +inp.value; out.textContent = (+inp.value).toFixed(step < 0.01 ? 3 : 2); }); }

  // ---------- the hand ----------

  // itself, more or less, and the brush is instantly loaded with the next colour.
  const STATES = ['idle', 'listening', 'thinking', 'speaking'];
  const LOOK = { // hand speed, size of the patch, how wildly it turns, stroke length, seconds the paint lasts
    idle:      { v: 0.32, R: 0.17, jit: 0.75, L: 1,   life: 7 },
    listening: { v: 0.15, R: 0.10, jit: 0.9,  L: 0.6, life: 9 },
    thinking:  { v: 0.85, R: 0.22, jit: 0.13, L: 1.5, life: 3.2 },
    speaking:  { v: 0.5,  R: 0.2,  jit: 0.6,  L: 1,   life: 4 },
  };
  const wgt = { idle: 1, listening: 0, thinking: 0, speaking: 0 }, cur = { ...LOOK.idle };
  let state = 'idle', x = 0, y = 0, t = 0, env = 0, envS = 0, jIdx = Math.random() * 21, kIdx = 0, st = null;
  let syl = 0, sylDur = 0.2, sylAmp = 0, phraseLeft = 2, pause = 0;
  function speech(dt) { if (pause > 0) { pause -= dt; return 0; } syl += dt;
    if (syl >= sylDur) { syl = 0; sylDur = 0.12 + Math.random() * 0.18; sylAmp = 0.35 + Math.random() * 0.65; phraseLeft -= sylDur; if (phraseLeft <= 0) { phraseLeft = 1.2 + Math.random() * 2.6; pause = 0.25 + Math.random() * 0.6; return 0; } }

  // side of the last, so lines sit next to each other with paper showing between them. When

    for (const p of previews) { const g = p.getContext('2d'); g.drawImage(cv, o, o, crop, crop, 0, 0, p.width, p.height); }
  }

  const tag = document.getElementById('tag');
  document.querySelectorAll('#states button').forEach(b => b.addEventListener('click', () => { state = b.dataset.state; tag.textContent = state; document.querySelectorAll('#states button').forEach(o => o.setAttribute('aria-pressed', o === b)); }));
  advance(8); resize(); draw();
  if (window.ResizeObserver) new ResizeObserver(() => { resize(); draw(); }).observe(cv);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)'); let last = 0;
  function frame(now) { const dt = last ? Math.min(0.05, (now - last) / 1000) : 0; last = now; if (dt) { advance(reduce.matches ? dt * 0.3 : dt); draw(); } requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
})();
</script>
